# ================================================================
#  BTS PROJECT — Render Deployment Config (render.yaml)
#  Docs: https://render.com/docs/render-yaml
# ================================================================

services:
  # ─── Web Service (Django + Gunicorn) ─────────────────────────
  - type: web
    name: bts-project
    runtime: python
    plan: free                        # Change to 'starter' for production
    region: oregon                    # Pick closest to Nigeria: frankfurt or singapore

    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate

    startCommand: gunicorn bts_core.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120

    healthCheckPath: /

    envVars:
      - key: SECRET_KEY
        generateValue: true           # Render auto-generates a secure key

      - key: DEBUG
        value: "False"

      - key: ALLOWED_HOSTS
        value: "bts-project.onrender.com,your-custom-domain.com"
        # Update with your actual domain after deploy

      - key: DATABASE_URL
        fromDatabase:
          name: bts-db
          property: connectionString

      - key: PYTHON_VERSION
        value: "3.11.0"

      # ─── Add these manually in the Render dashboard ───────────
      # PAYSTACK_PUBLIC_KEY   → your Paystack public key
      # PAYSTACK_SECRET_KEY   → your Paystack secret key
      # EMAIL_HOST_USER       → your Gmail address
      # EMAIL_HOST_PASSWORD   → your Gmail app password

  # ─── PostgreSQL Database ─────────────────────────────────────
databases:
  - name: bts-db
    databaseName: bts_production
    plan: free                        # 1GB free PostgreSQL on Render
    region: oregon

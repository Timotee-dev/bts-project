{% extends 'base.html' %}
{% block title %}Forgot Password — BTS Project{% endblock %}
{% block content %}
<section class="section" style="min-height:75vh;display:flex;align-items:center;background:var(--surface);">
  <div class="container" style="max-width:460px;">
    <div class="card">
      <div style="text-align:center;margin-bottom:28px;">
        <div style="width:64px;height:64px;background:var(--green-pale);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:1.8rem;">🔑</div>
        <h1 style="font-size:1.5rem;font-weight:800;color:var(--dark);margin-bottom:8px;">Forgot your password?</h1>
        <p style="color:var(--gray);font-size:0.9rem;">No problem. Enter your email address and we'll send you a link to reset it.</p>
      </div>
      <form method="post">
        {% csrf_token %}
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" name="email" class="form-control" required
                 placeholder="the email you registered with" autofocus>
        </div>
        <button type="submit" class="btn btn-primary btn-lg btn-block">
          <i class="fas fa-paper-plane"></i> Send Reset Link
        </button>
      </form>
      <p style="text-align:center;margin-top:20px;font-size:0.85rem;color:var(--gray);">
        Remembered it? <a href="{% url 'login' %}" style="color:var(--green);font-weight:600;">Sign in</a>
      </p>
    </div>
  </div>
</section>
{% endblock %}

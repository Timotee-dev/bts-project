{% extends 'base.html' %}
{% block title %}Password Reset Complete — BTS Project{% endblock %}
{% block content %}
<section class="section" style="min-height:75vh;display:flex;align-items:center;background:var(--surface);">
  <div class="container" style="max-width:460px;text-align:center;">
    <div class="card">
      <div style="font-size:3.5rem;margin-bottom:16px;">✅</div>
      <h1 style="font-size:1.5rem;font-weight:800;color:var(--dark);margin-bottom:12px;">Password updated!</h1>
      <p style="color:var(--gray);margin-bottom:28px;">
        Your password has been set successfully. You can now sign in with your new password.
      </p>
      <a href="{% url 'login' %}" class="btn btn-primary btn-lg btn-block">
        <i class="fas fa-sign-in-alt"></i> Sign In Now
      </a>
    </div>
  </div>
</section>
{% endblock %}
